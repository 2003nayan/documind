[project]
name = "documind-pipeline"
version = "0.1.0"
description = "Offline high-quality ingestion: Docling parsing, OCR, chunking and indexing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "documind-core",
    "docling>=2.15",
    "torch",
    "torchvision",
    "typer>=0.12",
]

[project.scripts]
documind-pipeline = "documind_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documind_pipeline"]
