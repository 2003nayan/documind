# Local development only. Production uses Neon (Postgres) and Qdrant Cloud free tiers.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]
volumes:
  pgdata:
  qdrantdata:
