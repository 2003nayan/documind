[project]
name = "documind-api"
version = "0.1.0"
description = "Lightweight serving API: hybrid retrieval, grounded answers, lite uploads"
requires-python = ">=3.12,<3.13"
dependencies = [
    "documind-core[gemini]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
