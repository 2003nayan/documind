[project]
name = "documind-core"
version = "0.1.0"
description = "Shared schemas, chunking, embeddings and storage for DocuMind"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "fastembed>=0.4",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documind_core"]
